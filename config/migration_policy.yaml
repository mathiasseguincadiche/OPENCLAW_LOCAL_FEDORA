schema_version: "1.0.0"
platform_version: "0.1.0"

source:
  repository: mathiasseguincadiche/OPENCLAW_LOCAL
  platform: windows11-pro
  import_strategy: portable-core-only
  never_copy:
    - scripts/windows
    - START_MENU.cmd
    - Windows Registry assumptions
    - WSL2 nominal paths
    - Task Scheduler lifecycle
    - drive-letter runtime roots

preserve:
  - eight_agent_roles
  - local_first_security
  - no_silent_cloud_fallback
  - model_fleet_contract
  - project_orchestrator
  - project_intake
  - artifact_exchange
  - golden_projects
  - telemetry
  - finops
  - qualification_hard_40m
  - model_identity_lock
  - release_readiness

replace:
  powershell_orchestration: bash_plus_python
  scheduled_task: systemd_user
  windows_acl: posix_permissions_plus_selinux
  wsl2_devops: native_linux
  windows_gpu_inventory: sysfs_drm_vulkan_level_zero
  drive_letters: linux_mounts

migration_gates:
  M0: windows_baseline_captured
  M1: portable_core_imported
  M2: linux_ci_pass
  M3: fedora_stock_kernel_hardware_pass
  M4: b580_vulkan_level_zero_pass
  M5: openclaw_eight_agents_e2e_pass
  M6: backend_and_kernel_comparison_pass
  M7: golden_projects_and_representative_project_pass
  M8: human_approval_to_make_fedora_nominal

rollback:
  windows_repository_remains_independent: true
  fedora_kernel_baseline_remains_bootable: true
  never_destroy_source_evidence: true
