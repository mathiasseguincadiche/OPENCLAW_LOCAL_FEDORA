schema_version: "1.0.0"
platform_version: "0.1.0"

host:
  cpu:
    vendor: AMD
    model: Ryzen 7 7700
    cores: 8
    threads: 16
  memory:
    installed_gib: 48
    minimum_supported_gib: 48
    upgrade_target_gib: 96
  gpu:
    vendor: Intel
    family: Arc B-Series
    model: Arc B580
    vram_gib: 12
    kernel_driver: xe
    require_render_node: true
    require_resizable_bar: true
  storage:
    system:
      model: Crucial T705
      interface: PCIe 5.0 NVMe
    data:
      model: Crucial T705
      interface: PCIe 5.0 NVMe
      preferred_mount: /srv/openclaw-local

firmware:
  uefi_required: true
  iommu_recommended: true
  secure_boot_policy: supported-not-required-for-upstream-kernel-candidate

performance:
  cpu_governor_preferred_during_benchmark: performance
  require_ac_power: true
  require_no_suspend_during_benchmark: true
  require_gpu_telemetry: true
