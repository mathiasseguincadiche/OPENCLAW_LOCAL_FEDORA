schema_version: "1.1.0"
platform_version: "0.1.0"

# Versions exactes installées et vérifiées. Pour en changer : docs/fiches/08-reglages.md
openclaw:
  version: "2026.9.8"
  lock: exact
  automatic_update: false
  plugins:
    parallel:
      package: "@openclaw/parallel-plugin"
      version: "2026.9.8"
      lock: exact
      provider: parallel-free

ollama:
  version: "0.35.1"

upgrade_policy:
  openclaw_version_locked: true
  openclaw_update_requires_explicit_contract_change: true
  parallel_plugin_version_locked: true
  automatic_runtime_upgrade: false
