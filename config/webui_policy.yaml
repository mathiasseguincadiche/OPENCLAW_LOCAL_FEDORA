schema_version: 1.0.0
platform_version: 0.1.0
release: v0.12.3
image: ghcr.io/open-webui/open-webui:v0.12.3-slim
variant: slim
web_port: 3000
bridge_port: 18891
dashboard_port: 18890
memory_limit: 3g
cpu_limit: 2
workers: 1
deployment: podman-rootless
scope: personal-loopback
shared_worker_lock: true
max_history_bytes: 32000
max_response_tokens: 4096
speech:
  enabled: true
  host: 127.0.0.1
  port: 18893
  stt_model: small
  stt_device: cpu
  stt_compute_type: int8
  language: fr
  tts_voice: fr-fr
  tts_speed: 165
  max_audio_bytes: 26214400
notes:
  - Limite mémoire de départ, à ajuster après mesure sur le PC.
  - Réponses mises en tampon; aucun streaming token par token dans cette version.
  - Documents de projet importés dans l’atelier, jamais via une seconde chaîne RAG.
