notes:
- Les six rôles rendent leurs livrables sous forme JSON au worker; seul le collecteur
  écrit les chemins attendus.
- Les outils exec/process et les écritures natives sont désactivés dans le profil
  quotidien.
- Le worker est le seul ordonnanceur; pas de délégation native imbriquée.
- Internet fournit des sources non fiables; aucun modèle cloud de secours.
- Un navigateur ou une exécution de code exigent un profil isolé qualifié séparément.
