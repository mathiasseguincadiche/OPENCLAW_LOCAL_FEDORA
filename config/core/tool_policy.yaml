schema_version: 1.3.0
platform_version: 0.1.0
security_defaults:
  profile: minimal
  fs_workspace_only: true
  exec_mode: ask
  elevated_enabled: false
  cloud_tools_without_explicit_escalation: false
  document_tools:
  - pdf
  - view_image
write_enforcement:
  protected_inputs:
  - intake
  - sources
  - context/exchange
  guard_manifest: .openclaw-fedora-input-guard.json
  fail_on_protected_input_change: true
  collect_scopes_are_enforced: true
  central_project_accepts_only_collected_task_outputs: true
agents:
  chef-operations:
    profile: minimal
    also_allow:
    - read
    - web_search
    - web_fetch
    - agents_list
    - sessions_list
    - sessions_history
    - sessions_search
    - session_status
    - pdf
    - view_image
    - clawfedora_search
    - clawfedora_outline
    deny:
    - apply_patch
    - edit
    - exec
    - process
    - write
    collect_scopes:
    - work
    - deliverables
    - evidence
    - diagrams
  expert-recherche:
    profile: minimal
    also_allow:
    - read
    - web_search
    - web_fetch
    - session_status
    - pdf
    - view_image
    - clawfedora_search
    - clawfedora_outline
    deny:
    - apply_patch
    - edit
    - exec
    - process
    - write
    collect_scopes:
    - work
    - deliverables
    - evidence
    - diagrams
  architecte-solutions:
