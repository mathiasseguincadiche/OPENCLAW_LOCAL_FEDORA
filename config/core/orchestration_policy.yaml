schema_version: "1.0.0"
platform_version: "0.1.0"
engine:
  fail_closed: true
  local_first: true
  final_human_approval_required: true
  document_ingestion_required_before_analysis: true
  artifact_exchange_fail_closed: true
status_flow: [INTAKE_READY, ANALYZED, CLARIFICATION_REQUIRED, PLANNED, ASSIGNED, IN_PROGRESS, VALIDATING, REVIEW, PACKAGING, COMPLETE]
transitions:
  INTAKE_READY: [ANALYZED]
  ANALYZED: [CLARIFICATION_REQUIRED, PLANNED]
  CLARIFICATION_REQUIRED: [ANALYZED]
  PLANNED: [ASSIGNED]
  ASSIGNED: [IN_PROGRESS]
  IN_PROGRESS: [VALIDATING]
  VALIDATING: [IN_PROGRESS, REVIEW]
  REVIEW: [IN_PROGRESS, PACKAGING]
  PACKAGING: [COMPLETE]
  COMPLETE: []
artifacts:
  analysis: context/project_analysis.json
  clarifications: context/clarifications.json
  plan: context/project_plan.json
  assignments: context/task_assignments.json
  validation: evidence/validation_report.json
  review: evidence/review_report.json
  package_manifest: deliverables/package_manifest.json
  final_report: evidence/final_report.json
execution:
  max_parallel_tasks: 1
  max_task_attempts: 2
  task_output_namespaced_by_task: true
  propagate_passed_outputs_to_dependents: true
human_gates:
  blocking_clarifications: true
  destructive_actions: true
  remote_publication: true
  cloud_escalation: true
  final_completion: true
