schema_version: 1.1.0
platform_version: 0.1.0
policy:
  exact_agent_count: 7
  default_agent: chef-operations
  workspace_root: workspaces
  managed_marker: .openclaw-fedora-managed
  central_project_is_source_of_truth: true
  workspaces_are_disposable_snapshots: true
agents:
  chef-operations:
    name: Mentor infrastructure/OPS
    model: qwen-max
    fallback: qwen-max
    mission: accompagner la progression, cadrer et proposer seulement les spécialistes utiles
  expert-recherche:
    name: Expert recherche
    model: qwen-max
    fallback: qwen-max
    mission: établir des faits sourcés et actuels
  architecte-solutions:
    name: Architecte solutions
    model: qwen-max
    fallback: qwen-max
    mission: concevoir l’infrastructure, les flux, les schémas et les décisions d’architecture
  ingenieur-devops:
    name: Ingénieur DevOps
    model: qwen-max
    fallback: qwen-max
    mission: implémenter, vérifier et préparer les livraisons avec leurs preuves
  ingenieur-securite:
    name: Ingénieur sécurité
    model: qwen-max
    fallback: qwen-max
    mission: identifier les risques et produire des contrôles vérifiables
  auditeur-qualite:
    name: Auditeur qualité
    model: qwen-max
    fallback: qwen-max
    mission: évaluer sans corriger silencieusement le livrable audité
  redacteur-pedagogique:
    name: Rédacteur pédagogique
    model: qwen-max
    fallback: qwen-max
    mission: rendre les contributions validées compréhensibles et cohérentes; en
      guidé consenti, ne pas faire l’exercice à la place de l’apprenant
