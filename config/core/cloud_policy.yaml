schema_version: 1.0.0
platform_version: 0.2.0
# Le cloud est une option, jamais un état par défaut. Sa mise en service est une décision
# d'exécution (état local, hors dépôt) qui exige que le filtre de confidentialité et le contrôle
# du budget soient opérationnels ensemble.
policy:
  enabled_by_default: false
  requires:
  - privacy_filter
  - budget_guard
  local_to_cloud_fallback: forbidden
  cloud_to_local_fallback: visible_only
  provider_id: cloudgw
  upstream: openrouter
# OpenClaw ne parle jamais à OpenRouter : il parle à cette passerelle locale, qui détient seule
# la clé, filtre tout le contenu sortant et compte chaque appel facturé.
gateway:
  host: 127.0.0.1
  port: 18892
  path_prefix: /v1
  api: openai-completions
  # Jeton local entre OpenClaw et la passerelle : ce n'est pas la clé du fournisseur.
  token_env: CLAWFEDORA_CLOUD_GATEWAY_TOKEN
  # Chemin relatif à l'état d'exécution ; lu uniquement par la passerelle, droits 0600.
  upstream_key_file: cloud/upstream.key
  timeout_seconds: 300
# Plafond mensuel en euros réellement payés. Trois couches indépendantes : crédits prépayés
# (le vrai plafond d'achat), limite de la clé chez le fournisseur, et ce journal local.
# `eur_per_usd` convertit 1 $ d'usage en euros payés de façon pessimiste (change, frais d'achat
# de crédits, TVA) : à relire avec les relevés réels (commande de rapprochement).
budget:
  monthly_cap_eur: 35
  alert_ratio: 0.8
  eur_per_usd: 1.3
  recommended_key_limit_usd: 23
  # Enveloppes en euros estimés payés ; la réserve de 10 € n'est pas routable.
  model_caps_eur:
    deepseek/deepseek-v4.1-flash-1017: 15
    openai/gpt-6.2-sol: 10
  ledger_file: cloud/ledger-{month}.jsonl
# Seul point de sortie réseau vers le fournisseur. L'hôte est figé : la passerelle ne suit
# aucune adresse reçue dans une requête.
upstream:
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 300
limits:
  max_request_bytes: 4194304
  max_messages: 500
  max_tools: 64
model:
  alias: cloud-main
  upstream_id: deepseek/deepseek-v4.1-flash-1017
  display_name: DeepSeek V4.1 Flash 1017 (cloud, via passerelle locale)
  # Le cloud n'est pas bridé aux limites du petit modèle local : DeepSeek reçoit un contexte
  # large pour les dépôts, documents et boucles d'outils complexes, avec une sortie ample.
  context_tokens: 1048576
  max_output_tokens: 32768
  # Tarifs ci-dessous = plafonds de sécurité, non prix public garanti.
  # Vérifier un endpoint 1017 compatible confidentialité, outils et raisonnement.
  # Ces tarifs servent aussi de plafond OpenRouter : la réservation budgétaire et le routage
  # partagent donc exactement le même pire cas autorisé.
  pricing_usd_per_million:
    input: 0.25
    output: 0.75
# Deux modèles externes ; les références locales combinent modèle et profil.
# Le worker choisit une route approuvée, ou applique le choix manuel de l'opérateur. Chaque modèle impose SES prix maximaux à
# OpenRouter et au budget : un endpoint plus cher est refusé, jamais facturé au-delà.
default_upstream_model: standard
upstream_models:
  standard:
    upstream_id: deepseek/deepseek-v4.1-flash-1017
    display_name: DeepSeek V4.1 Flash 1017
    enabled: true
    pricing_usd_per_million:
      input: 0.25
      output: 0.75
  expert:
    upstream_id: openai/gpt-6.2-sol
    display_name: GPT-6.2 Sol
    enabled: true
    allowed_efforts: [low, medium, high, xhigh]
    # Les endpoints standard déclarent tools, tool_choice, reasoning et seed.
    drop_parameters: [parallel_tool_calls, stop, temperature, top_p]
    # Plafonds prudents : écriture cache au palier long et sortie au palier long.
    # Le tarif standard constaté est 2 / 10 $/M. Voir fiche cloud.
    pricing_usd_per_million:
      input: 5.0
      output: 15.0
# Les profils réduisent l'effort et/ou le plafond de sortie SANS changer le
# fournisseur, les prix maximaux, la confidentialité ni les permissions.
# « equilibre » est le défaut sobre ; « approfondi » reste un choix explicite.
# Le choix est stocké hors Git par l'opérateur, via la CLI --apply ; jamais par
# un paramètre client, un agent ou une bascule implicite local -> cloud.
default_reasoning_profile: equilibre
reasoning_profiles:
  rapide:
    effort: low
    max_output_tokens: 4096
  equilibre:
    effort: medium
    max_output_tokens: 8192
  soutenu:
    effort: high
    max_output_tokens: 16384
  approfondi:
    effort: xhigh
    max_output_tokens: 32768
# Le routage automatique ne s'applique qu'après accord cloud. Aucune classification
# par mots-clés, aucun nouvel appel automatique sur panne, refus ou budget épuisé.
agent_routing:
  default_mode: auto
  roles:
    chef-operations: {routine: [standard, soutenu], escalation: [expert, equilibre]}
    expert-recherche: {routine: [standard, rapide], escalation: [standard, soutenu]}
    architecte-solutions: {routine: [standard, soutenu], escalation: [expert, soutenu]}
    ingenieur-devops: {routine: [standard, soutenu], escalation: [expert, soutenu]}
    ingenieur-securite: {routine: [standard, soutenu], escalation: [expert, soutenu]}
    auditeur-qualite: {routine: [standard, soutenu], escalation: [expert, soutenu]}
    redacteur-pedagogique: {routine: [standard, rapide], escalation: [expert, equilibre]}
# Réglages de sécurité imposés par la passerelle à chaque requête (pas par OpenClaw).
upstream_params:
  provider:
    data_collection: deny
    require_parameters: true
    sort: throughput
    max_price:
      prompt: 0.25
      completion: 0.75
  # Référence contractuelle du profil par défaut « equilibre » (medium).
  # La passerelle substitue uniquement effort via un profil local validé.
  reasoning:
    effort: medium
