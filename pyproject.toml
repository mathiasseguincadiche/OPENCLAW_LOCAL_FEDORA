[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-local-fedora"
version = "0.2.0"
description = "Local AI workshop on Fedora: chat, DevOps mentor and multi-role projects with OpenClaw and Ollama"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "mathiasseguincadiche"}]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "defusedxml==0.7.1",
  "yamllint==1.38.0",
  "pymarkdownlnt==0.9.40",
  "reportlab==5.1.0",
  "python-docx==1.2.0",
  "markdown-it-py==4.2.0",
  "pypdf==6.21.4",
  "Pillow==13.0.0",
]

[project.scripts]
clawfedora = "clawfedora.cli:main"
clawfedora-ops = "clawfedora.ops_cli:main"
clawfedora-lab = "clawfedora.devops_lab:main"
clawfedora-evals = "clawfedora.agent_eval:main"
clawfedora-pedagogy = "clawfedora.pedagogy_eval:main"
clawfedora-ci-proof = "clawfedora.ci_evidence:main"
clawfedora-ci-private-proof = "clawfedora.ci_private_evidence:main"
clawfedora-fedora-precheck = "clawfedora.fedora_acceptance:main"
clawfedora-backup-verify = "clawfedora.backup_acceptance:main"
clawfedora-gpu-benchmark = "clawfedora.gpu_acceptance:main"
clawfedora-vision-smoke = "clawfedora.vision_acceptance:main"
clawfedora-doc-bundle = "clawfedora.document_bundle:main"

[project.optional-dependencies]
speech = [
  "faster-whisper==1.2.1",
]
# Exact versions observed green in CI on 3 November 2026: a new release of a linter, type
# checker or test runner must arrive through a reviewed change (Dependabot), never alone.
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
  "types-PyYAML==6.0.12.20261103",
  "types-defusedxml==0.7.0.20260504",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clawfedora = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
target-version = "py312"
line-length = 102

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["clawfedora"]

# Open WebUI functions run inside the WebUI container, where open_webui exists.
[[tool.mypy.overrides]]
module = ["open_webui", "open_webui.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
