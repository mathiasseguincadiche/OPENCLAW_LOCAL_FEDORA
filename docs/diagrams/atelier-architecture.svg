<text x="457" y="618" fill="#416576" text-anchor="middle" font-size="13">Collecte vérifiée, non libre</text>
<!-- Orchestration -->
<rect x="633" y="248" width="232" height="131" rx="16" fill="#163449"/>
<text x="749" y="284" fill="#fff" text-anchor="middle" font-size="23" font-weight="700">OpenClaw</text>
<text x="749" y="315" fill="#e2eef4" text-anchor="middle" font-size="15">Un des sept rôles</text>
<text x="749" y="340" fill="#e2eef4" text-anchor="middle" font-size="14">Consignes et outils</text>
<text x="749" y="361" fill="#e2eef4" text-anchor="middle" font-size="13">Même mission sur les 2 routes</text>
