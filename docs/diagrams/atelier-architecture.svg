<rect x="332" y="158" width="250" height="108" rx="15" fill="#284659"/>
<text x="457" y="193" fill="#fff" text-anchor="middle" font-weight="700" font-size="20">Pont de chat</text>
<text x="457" y="219" fill="#e0eef2" text-anchor="middle" font-size="14">Port 18891</text>
<text x="457" y="240" fill="#e0eef2" text-anchor="middle" font-size="14">Commandes et historique</text>
<rect x="332" y="332" width="250" height="107" rx="15" fill="#284659"/>
<text x="457" y="368" fill="#fff" text-anchor="middle" font-weight="700" font-size="20">Moteur de projets</text>
<text x="457" y="395" fill="#e0eef2" text-anchor="middle" font-size="14">Plan · verrou · collecte</text>
<text x="457" y="417" fill="#e0eef2" text-anchor="middle" font-size="13">Garde-fous et confirmations</text>
<rect x="332" y="535" width="250" height="111" rx="15" fill="#e4f0f3" stroke="#87aabb" stroke-width="2"/>
