<rect x="34" y="158" width="244" height="108" rx="15" fill="#126b74"/>
<text x="156" y="193" fill="#fff" text-anchor="middle" font-weight="700" font-size="21">Open WebUI</text>
<text x="156" y="221" fill="#e5f8f6" text-anchor="middle" font-size="14">Chat · rôles · fichiers</text>
<text x="156" y="243" fill="#e5f8f6" text-anchor="middle" font-size="13">Modèle choisi dans le chat</text>
<rect x="34" y="332" width="244" height="107" rx="15" fill="#126b74"/>
<text x="156" y="368" fill="#fff" text-anchor="middle" font-weight="700" font-size="21">Atelier Projets</text>
<text x="156" y="395" fill="#e5f8f6" text-anchor="middle" font-size="14">Tâches · sources · accords</text>
<text x="156" y="417" fill="#e5f8f6" text-anchor="middle" font-size="13">Consentement cloud du projet</text>
<rect x="34" y="535" width="244" height="111" rx="15" fill="#ffffff" stroke="#a3becb" stroke-width="2"/>
<text x="156" y="567" fill="#183d50" text-anchor="middle" font-size="19" font-weight="700">Tu gardes la décision</text>
<text x="156" y="593" fill="#436579" text-anchor="middle" font-size="14">Choisir le modèle et le plan</text>
<text x="156" y="616" fill="#436579" text-anchor="middle" font-size="14">Approuver · vérifier · tester</text>
