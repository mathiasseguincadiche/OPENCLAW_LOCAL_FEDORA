<text x="1081" y="222" text-anchor="middle" fill="#173d4e" font-size="23" font-weight="700">Ollama + Qwen 3.5 9B</text>
<text x="1081" y="251" text-anchor="middle" fill="#315c70" font-size="14">Fedora · Intel Arc B580</text>
<text x="1081" y="278" text-anchor="middle" fill="#315c70" font-size="14">Quotidien · privé · tâches ciblées</text>
<!-- Cloud gateway and model -->
<rect x="916" y="365" width="330" height="118" rx="15" fill="#fff1de" stroke="#bd8749" stroke-width="2.5"/>
<text x="939" y="392" fill="#906029" font-size="16" font-weight="700">B · CLOUD SUR ACCORD</text>
<text x="1081" y="426" text-anchor="middle" fill="#815428" font-size="21" font-weight="700">Passerelle :18892</text>
<text x="1081" y="451" text-anchor="middle" fill="#815428" font-size="14">Filtre · budget · politique fournisseur</text>
<rect x="916" y="535" width="330" height="111" rx="15" fill="#fae7cd" stroke="#bd8749" stroke-width="2.5"/>
<text x="1081" y="570" text-anchor="middle" fill="#784b22" font-size="21" font-weight="700">OpenRouter → DeepSeek</text>
<text x="1081" y="597" text-anchor="middle" fill="#84572b" font-size="16">V4.1 Flash</text>
<text x="1081" y="620" text-anchor="middle" fill="#84572b" font-size="13">Analyses longues et complexes</text>
