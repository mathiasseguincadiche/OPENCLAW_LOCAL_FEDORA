<text x="749" y="569" fill="#254d5f" text-anchor="middle" font-size="19" font-weight="700">Outils métier</text>
<text x="749" y="594" fill="#416576" text-anchor="middle" font-size="14">Recherche · statique</text>
<text x="749" y="617" fill="#416576" text-anchor="middle" font-size="13">Exports et schémas locaux</text>
