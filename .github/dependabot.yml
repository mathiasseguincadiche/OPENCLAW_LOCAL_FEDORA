# Proposals only: every update is a pull request that must pass the full CI, including the
# hash locks, the native OpenClaw checks and the Fedora 45 Node.js engine check. An OpenClaw
# update also needs runtime_versions.yaml, the tarball digest and the contracts: the lock
# checks fail until they are changed together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: "/config/npm-runtime"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      # From 2026.10.6 OpenClaw requires Node >= 24.22.1 (or >= 26.12.1). Fedora 45 ships
      # nodejs24 24.18.0 and nodejs26 26.3.1: the installer's npm ci --engine-strict would
      # fail on the PC (docs/audits/2026-11-02/README.md). Lift this rule when Fedora 45
      # provides a compatible Node; the upgrade then also changes runtime_versions.yaml,
      # install_artifact_integrity.json and the contracts in the same pull request.
      - dependency-name: "openclaw"
        versions: [">=2026.10.6"]
      - dependency-name: "@openclaw/parallel-plugin"
        versions: [">=2026.10.6"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # httpx2 requires exactly the same httpcore2 version (2.14.0 with 2.14.0, 2.16.0 with
      # 2.16.0): proposed alone, either one makes the speech closure unresolvable (#173).
      httpx2-httpcore2:
        patterns:
          - "httpx2"
          - "httpcore2"
