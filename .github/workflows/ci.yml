name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Repository contracts
        run: clawfedora validate
      - name: Ruff
        run: ruff check src tests scripts/validation
      - name: Mypy
        run: mypy src
      - name: Tests with coverage
        run: pytest -q --cov=clawfedora --cov-report=term-missing --cov-fail-under=80

  runtime-lock:
    name: runtime-lock-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fresh production install with reviewed constraints
        run: python -m pip install --constraint config/python-runtime-constraints.txt -e .
      - name: Verify the full observed production package inventory
        run: |
          python -m pip check
          python scripts/validation/check_python_lock.py --strict
          python scripts/validation/check_runtime_dependencies.py

  native-openclaw:
    name: native-openclaw
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Verify offline npm user-prefix executable layout
        run: python scripts/validation/check_npm_prefix_layout.py
      - name: Install repository
        run: python -m pip install -e .
      - name: Production-only document preview smoke
        run: |
          python -m pip check
          python scripts/validation/check_runtime_dependencies.py
      - name: Install pinned OpenClaw and Parallel plugin
        shell: bash
        run: |
          OPENCLAW_VERSION="$(python -c 'from pathlib import Path; from clawfedora.core_config import root_contract; print(root_contract(Path.cwd(), "runtime_versions.yaml")["openclaw"]["version"])')"
          PARALLEL_VERSION="$(python -c 'from pathlib import Path; from clawfedora.core_config import root_contract; print(root_contract(Path.cwd(), "runtime_versions.yaml")["openclaw"]["plugins"]["parallel"]["version"])')"
          NATIVE_ROOT="$RUNNER_TEMP/native-openclaw"
          mkdir -p "$NATIVE_ROOT"
          npm install --ignore-scripts --prefix "$NATIVE_ROOT" "openclaw@$OPENCLAW_VERSION" "@openclaw/parallel-plugin@$PARALLEL_VERSION"
          echo "$NATIVE_ROOT/node_modules/.bin" >> "$GITHUB_PATH"
          echo "OPENCLAW_SCHEMA_PARALLEL_PATH=$NATIVE_ROOT/node_modules/@openclaw/parallel-plugin" >> "$GITHUB_ENV"
      - name: Native schema validation
        run: python scripts/validation/check_openclaw_schema.py
      - name: Native prompt limits
        run: python scripts/validation/check_prompt_size.py
      - name: Native cloud route
        run: python scripts/validation/check_cloud_route.py

  python:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Contracts and tests
        run: |
          clawfedora validate
          pytest -q

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bash syntax
        run: |
          bash -n menu.sh
          for file in scripts/linux/*.sh scripts/linux/lib/*.sh; do bash -n "$file"; done
      - name: ShellCheck
        run: shellcheck menu.sh scripts/linux/*.sh scripts/linux/lib/*.sh

  fedora-44-rejection:
    name: fedora-44-rejection
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:44
    timeout-minutes: 10
    steps:
      - name: Install checkout tooling
        run: dnf install -y git
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Confirm legacy Fedora 44 is explicitly refused
        shell: bash
        run: |
          source /etc/os-release
          test "$ID" = fedora
          test "$VERSION_ID" = 44
          if bash scripts/linux/00_bootstrap.sh >/tmp/bootstrap-rejection.log 2>&1; then
            cat /tmp/bootstrap-rejection.log
            echo "Expected Fedora 44 to be rejected" >&2
            exit 1
          fi
          grep -F "Fedora 45 requis" /tmp/bootstrap-rejection.log

  fedora-45-contract:
    name: fedora-45-contract
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:45
    timeout-minutes: 20
    steps:
      - name: Install Fedora 45 Python and checkout tooling
        run: dnf install -y git gcc gcc-c++ python3 python3-devel python3-pip python3-virtualenv shadow-utils util-linux
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert Fedora 45 container baseline (pre-release until official launch)
        shell: bash
        run: |
          source /etc/os-release
          test "$ID" = fedora
          test "$VERSION_ID" = 45
          grep -F 'VERSION_ID:-}" != "45"' scripts/linux/00_bootstrap.sh
          grep -F 'GNOME Shell 51 requis' scripts/linux/00_bootstrap.sh
      - name: Verify dry-run and reject unsupported headless apply without host mutation
        shell: bash
        run: |
          useradd -m -U claw-ci
          runuser -u claw-ci -- bash scripts/linux/00_bootstrap.sh | grep -F 'DRY_RUN=PASS'
          if runuser -u claw-ci -- bash scripts/linux/00_bootstrap.sh --apply >/tmp/headless-rejection.log 2>&1; then
            echo "GNOME 51/Wayland required: headless apply should fail" >&2
            exit 1
          fi
          grep -E 'GNOME Shell 51 requis|Fedora 45 stable requis' /tmp/headless-rejection.log
      - name: Test Fedora 45 Python source and contracts in container
        run: |
          python3 -m venv /tmp/clawfedora45-venv
          /tmp/clawfedora45-venv/bin/python -m pip install --constraint config/python-runtime-constraints.txt -e ".[dev]"
          /tmp/clawfedora45-venv/bin/python -m pip check
          /tmp/clawfedora45-venv/bin/python scripts/validation/check_python_lock.py
          /tmp/clawfedora45-venv/bin/clawfedora validate
          /tmp/clawfedora45-venv/bin/pytest -q

  lock-candidates:
    name: lock-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Produce exact npm closure candidate from selected versions
        run: |
          python -m pip install "PyYAML==6.0.3"
          mkdir -p /tmp/claw-closure
          python - <<'PY'
          import json
          import pathlib
          import yaml
          manifest = yaml.safe_load(pathlib.Path("config/runtime_versions.yaml").read_text())
          p = {
              "name": "clawfedora-runtime-closure",
              "version": "0.1.0",
              "private": True,
              "dependencies": {
                  "openclaw": manifest["openclaw"]["version"],
                  "@openclaw/parallel-plugin": manifest["openclaw"]["plugins"]["parallel"]["version"],
              },
          }
          pathlib.Path("/tmp/claw-closure/package.json").write_text(json.dumps(p, indent=2) + "\n")
          PY
          npm install --package-lock-only --prefix /tmp/claw-closure --ignore-scripts --no-audit --no-fund
          npm ci --prefix /tmp/claw-closure --ignore-scripts --no-audit --no-fund
          npm ls --all --prefix /tmp/claw-closure >/dev/null
      - name: Export fully hashed Python production closure candidates
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import pathlib
          import re
          import urllib.request

          roots = {}
          for line in pathlib.Path("config/python-runtime-constraints.txt").read_text().splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              name, version = line.split("==", 1)
              roots[name] = version

          def get_one(item):
              name, version = item
              url = "https://pypi.org/pypi/" + name + "/" + version + "/json"
              with urllib.request.urlopen(url, timeout=25) as res:
                  data = json.load(res)
              hashes = set()
              for file in data["urls"]:
                  filename = file["filename"].lower()
                  if file["packagetype"] == "sdist":
                      hashes.add(file["digests"]["sha256"])
                  elif file["packagetype"] == "bdist_wheel" and (
                      ("none-any.whl" in filename)
                      or ("x86_64" in filename and "linux" in filename)
                  ):
                      hashes.add(file["digests"]["sha256"])
              if not hashes:
                  raise RuntimeError("No Linux x86_64 or source artifact: " + name)
              return name, version, sorted(hashes)

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              rows = list(pool.map(get_one, roots.items()))
          output = "# Reviewed public PyPI sdist and Linux x86_64 wheel SHA-256 hashes.\n"
          output += "# Generated from the exact production versions in python-runtime-constraints.txt.\n"
          for name, version, hashes in sorted(rows):
              output += name + "==" + version
              for digest in hashes:
                  output += " \\\n    --hash=sha256:" + digest
              output += "\n"
          pathlib.Path("/tmp/python-runtime-hashes.txt").write_text(output)
          print("PYTHON_HASH_PACKAGES=" + str(len(rows)))
          PY
      - name: Emit lockfile candidates for review (temporary acquisition job)
        run: |
          python - <<'PY'
          import pathlib
          for label, name in [
              ("NPM_LOCK", "/tmp/claw-closure/package-lock.json"),
              ("NPM_MANIFEST", "/tmp/claw-closure/package.json"),
              ("PYTHON_LOCK", "/tmp/python-runtime-hashes.txt"),
          ]:
              content = pathlib.Path(name).read_text()
              print(f"{label}_BEGIN")
              for index in range(0, len(content), 2000):
                  print(f"{label}_CHUNK|" + content[index:index + 2000].replace("\n", "\\n"))
              print(f"{label}_END")
          PY
