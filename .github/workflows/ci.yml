name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Repository contracts
        run: |
          clawfedora validate
          python scripts/validation/check_dependency_artifact_locks.py
      - name: Ruff
        run: ruff check src tests scripts/validation
      - name: Mypy
        run: mypy src
      - name: Tests with coverage
        run: pytest -q --cov=clawfedora --cov-report=term-missing --cov-fail-under=80

  runtime-lock:
    name: runtime-lock-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fresh production install with reviewed constraints
        run: |
          python -m pip install --require-hashes -r config/python-runtime-hashes.txt
          python -m pip install --no-deps -e .
      - name: Verify the full observed production package inventory
        run: |
          python -m pip check
          python scripts/validation/check_python_lock.py --strict
          python scripts/validation/check_runtime_dependencies.py

  native-openclaw:
    name: native-openclaw
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Verify offline npm user-prefix executable layout
        run: python scripts/validation/check_npm_prefix_layout.py
      - name: Install repository
        run: python -m pip install -e .
      - name: Production-only document preview smoke
        run: |
          python -m pip check
          python scripts/validation/check_runtime_dependencies.py
      - name: Install pinned OpenClaw and Parallel plugin
        shell: bash
        run: |
          OPENCLAW_VERSION="$(python -c 'from pathlib import Path; from clawfedora.core_config import root_contract; print(root_contract(Path.cwd(), "runtime_versions.yaml")["openclaw"]["version"])')"
          PARALLEL_VERSION="$(python -c 'from pathlib import Path; from clawfedora.core_config import root_contract; print(root_contract(Path.cwd(), "runtime_versions.yaml")["openclaw"]["plugins"]["parallel"]["version"])')"
          NATIVE_ROOT="$RUNNER_TEMP/native-openclaw"
          mkdir -p "$NATIVE_ROOT"
          cp config/npm-runtime/package.json config/npm-runtime/package-lock.json "$NATIVE_ROOT/"
          python scripts/validation/check_dependency_artifact_locks.py
          npm ci --ignore-scripts --no-audit --no-fund --engine-strict --prefix "$NATIVE_ROOT"
          npm ls --all --prefix "$NATIVE_ROOT" >/dev/null
          "$NATIVE_ROOT/node_modules/.bin/openclaw" --version | grep -F "$OPENCLAW_VERSION"
          node -e 'const p=require(process.argv[1]);if(p.version!==process.argv[2])process.exit(2)' "$NATIVE_ROOT/node_modules/@openclaw/parallel-plugin/package.json" "$PARALLEL_VERSION"
          echo "$NATIVE_ROOT/node_modules/.bin" >> "$GITHUB_PATH"
          echo "OPENCLAW_SCHEMA_PARALLEL_PATH=$NATIVE_ROOT/node_modules/@openclaw/parallel-plugin" >> "$GITHUB_ENV"
      - name: Native schema validation
        run: python scripts/validation/check_openclaw_schema.py
      - name: Native prompt limits
        run: python scripts/validation/check_prompt_size.py
      - name: Native cloud route
        run: python scripts/validation/check_cloud_route.py

  python:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Contracts and tests
        run: |
          clawfedora validate
          pytest -q

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bash syntax
        run: |
          bash -n menu.sh
          for file in scripts/linux/*.sh scripts/linux/lib/*.sh; do bash -n "$file"; done
      - name: ShellCheck
        run: shellcheck menu.sh scripts/linux/*.sh scripts/linux/lib/*.sh

  fedora-44-rejection:
    name: fedora-44-rejection
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:44
    timeout-minutes: 10
    steps:
      - name: Install checkout tooling
        run: dnf install -y git
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Confirm legacy Fedora 44 is explicitly refused
        shell: bash
        run: |
          source /etc/os-release
          test "$ID" = fedora
          test "$VERSION_ID" = 44
          if bash scripts/linux/00_bootstrap.sh >/tmp/bootstrap-rejection.log 2>&1; then
            cat /tmp/bootstrap-rejection.log
            echo "Expected Fedora 44 to be rejected" >&2
            exit 1
          fi
          grep -F "Fedora 45 requis" /tmp/bootstrap-rejection.log

  fedora-45-contract:
    name: fedora-45-contract
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:45
    timeout-minutes: 20
    steps:
      - name: Install Fedora 45 Python and checkout tooling
        run: dnf install -y git gcc gcc-c++ python3 python3-devel python3-pip python3-virtualenv python3.13 python3.13-devel shadow-utils util-linux
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert Fedora 45 container baseline (pre-release until official launch)
        shell: bash
        run: |
          source /etc/os-release
          test "$ID" = fedora
          test "$VERSION_ID" = 45
          grep -F 'VERSION_ID:-}" != "45"' scripts/linux/00_bootstrap.sh
          grep -F 'GNOME Shell 51 requis' scripts/linux/00_bootstrap.sh
      - name: Verify dry-run and reject unsupported headless apply without host mutation
        shell: bash
        run: |
          useradd -m -U claw-ci
          runuser -u claw-ci -- bash scripts/linux/00_bootstrap.sh | grep -F 'DRY_RUN=PASS'
          if runuser -u claw-ci -- bash scripts/linux/00_bootstrap.sh --apply >/tmp/headless-rejection.log 2>&1; then
            echo "GNOME 51/Wayland required: headless apply should fail" >&2
            exit 1
          fi
          grep -E 'GNOME Shell 51 requis|Fedora 45 stable requis' /tmp/headless-rejection.log
      - name: Verify PyPI artifact SHA-256 installation with native Fedora 45 Python
        run: |
          python3.13 -m venv /tmp/clawfedora45-hashed-venv
          /tmp/clawfedora45-hashed-venv/bin/python -m pip install --require-hashes -r config/python-runtime-hashes.txt
          /tmp/clawfedora45-hashed-venv/bin/python -m pip install --no-deps -e .
          /tmp/clawfedora45-hashed-venv/bin/python -m pip check
          /tmp/clawfedora45-hashed-venv/bin/python scripts/validation/check_python_lock.py --strict
      - name: Test Fedora 45 Python source and contracts in container
        run: |
          python3 -m venv /tmp/clawfedora45-venv
          /tmp/clawfedora45-venv/bin/python -m pip install --constraint config/python-runtime-constraints.txt -e ".[dev]"
          /tmp/clawfedora45-venv/bin/python -m pip check
          /tmp/clawfedora45-venv/bin/python scripts/validation/check_python_lock.py
          /tmp/clawfedora45-venv/bin/clawfedora validate
          /tmp/clawfedora45-venv/bin/pytest -q

  voice-fedora45-probe:
    name: voice-fedora45-probe
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:45
    timeout-minutes: 15
    steps:
      - name: Fedora tools and checkout
        run: dnf install -y git gcc gcc-c++ python3 python3-devel python3-pip python3-virtualenv python3.13 python3.13-devel
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Probe pinned production and speech dependencies on managed Python 3.13
        run: |
          python3.13 -m venv /tmp/claw-voice-venv
          /tmp/claw-voice-venv/bin/python -m pip install --constraint config/python-runtime-constraints.txt -e ".[speech]"
          /tmp/claw-voice-venv/bin/python -m pip check
          /tmp/claw-voice-venv/bin/python -V
      - name: Generate speech artifact hash candidates from official PyPI
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import pathlib
          import urllib.request
          parts = {}
          for line in pathlib.Path("config/python-speech-constraints.txt").read_text().splitlines():
              if "==" in line:
                  name, version = line.strip().split("==")
                  parts[name] = version

          def collect(item):
              name, version = item
              with urllib.request.urlopen(
                  "https://pypi.org/pypi/" + name + "/" + version + "/json", timeout=30
              ) as resp:
                  records = json.load(resp)
              hashes = set()
              for artifact in records["urls"]:
                  filename = artifact["filename"].lower()
                  if artifact["packagetype"] == "sdist" or (
                      artifact["packagetype"] == "bdist_wheel" and (
                          "none-any.whl" in filename or (
                              "x86_64" in filename and "linux" in filename
                          )
                      )
                  ):
                      hashes.add(artifact["digests"]["sha256"])
              if not hashes:
                  raise ValueError("No artifact for speech dependency " + name)
              return name, version, sorted(hashes)

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              rows = list(pool.map(collect, parts.items()))
          output = "# Fedora 45 Linux x86_64 speech dependencies, verified SHA-256.\\n"
          for name, version, hashes in sorted(rows):
              output += name + "==" + version
              for digest in hashes:
                  output += " \\\\n    --hash=sha256:" + digest
              output += "\\n"
          print("SPEECH_LOCK_BEGIN")
          for i in range(0, len(output), 2000):
              print("SPEECH_LOCK_CHUNK|" + output[i:i + 2000].replace("\\n", "\\\\n"))
          print("SPEECH_LOCK_END")
          PY
