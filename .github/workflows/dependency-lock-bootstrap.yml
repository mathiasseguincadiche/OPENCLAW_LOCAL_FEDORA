name: Dependency lock bootstrap (temporary)
on:
  push:
    branches:
      - hardening/dependency-integrity-20261019
permissions:
  contents: write
jobs:
  generate-reviewed-candidates:
    if: github.repository == 'mathiasseguincadiche/OPENCLAW_LOCAL_FEDORA'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Build npm integrity lock without executing package scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix config/npm-runtime
          node -e 'const p=require("./config/npm-runtime/package-lock.json");let n=0;for (const [k,v] of Object.entries(p.packages)) if (k && v.resolved && (!v.integrity || !v.resolved.startsWith("https://registry.npmjs.org/"))) throw Error("untrusted npm tarball "+k); else n++;console.log("NPM_LOCK_CLOSURE_PACKAGES="+n)'
      - name: Generate pinned Python wheels integrity candidate
        run: |
          python -m pip install 'pip-tools>=7,<8'
          pip-compile --generate-hashes --resolver=backtracking --allow-unsafe --output-file config/python-runtime-hashes.txt config/python-runtime-constraints.txt
      - name: Commit generated candidate locks to the guarded branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/npm-runtime/package-lock.json config/python-runtime-hashes.txt
          if ! git diff --cached --quiet; then
            git commit -m 'build(lock): generate npm and Python integrity candidate baselines'
            git push origin HEAD:hardening/dependency-integrity-20261019
          fi
