name: Dependency Audit

# Weekly audit of the dependencies already locked in the repository. Dependency Review only
# inspects what a pull request changes; a lock left untouched would never be re-audited.
# A scheduled failure is notified by GitHub to the repository owner.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - config/npm-runtime/**
      - config/python-*-hashes.txt
      - config/dependency_audit_exceptions.json
      - scripts/validation/check_dependency_audit.py
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node (the nodejs24 version of Fedora 45)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Audit the locked npm closure (registry advisories, nothing installed)
        shell: bash
        run: |
          set +e
          (cd config/npm-runtime && npm audit --package-lock-only --json) > "$RUNNER_TEMP/npm-audit.json"
          set -e
          python scripts/validation/check_dependency_audit.py npm "$RUNNER_TEMP/npm-audit.json"

  python:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Audit the locked Python artifacts (production, build and speech)
        shell: bash
        run: |
          python -m pip install pip-audit==2.10.1
          set +e
          pip-audit --disable-pip --no-deps --progress-spinner off --format json \
            --output "$RUNNER_TEMP/pip-audit.json" \
            -r config/python-runtime-hashes.txt \
            -r config/python-build-hashes.txt \
            -r config/python-speech-hashes.txt
          set -e
          python scripts/validation/check_dependency_audit.py python "$RUNNER_TEMP/pip-audit.json"
