name: Capture supply-chain locks (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'hardening/reproducible-supply-chain-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Resolve and test locked npm tree without lifecycle scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix config/npm-runtime
          npm ci --ignore-scripts --no-audit --no-fund --prefix config/npm-runtime
          npm ls --all --prefix config/npm-runtime >/dev/null
      - name: Resolve production and speech Python dependency closure
        run: |
          python -m venv /tmp/clawfedora-lock-venv
          /tmp/clawfedora-lock-venv/bin/python -m pip install 'setuptools>=80' wheel
          /tmp/clawfedora-lock-venv/bin/python -m pip install --constraint config/python-runtime-constraints.txt -e '.[speech]'
          /tmp/clawfedora-lock-venv/bin/python -m pip check
          /tmp/clawfedora-lock-venv/bin/python scripts/validation/check_python_lock.py
      - name: Resolve hashes only from official PyPI release file manifests
        run: |
          python - <<'PY'
          import json, pathlib, re, subprocess, urllib.request
          root=pathlib.Path('config')
          entries={}
          for raw in (root/'python-runtime-constraints.txt').read_text().splitlines():
              if not raw or raw.startswith('#'): continue
              name,version=raw.split('==')
              entries[re.sub(r'[-_.]+','-',name).lower()]=version
          venv='/tmp/clawfedora-lock-venv/bin/python'
          installed=json.loads(subprocess.check_output([venv,'-m','pip','list','--format=json']))
          closure={re.sub(r'[-_.]+','-',p['name']).lower():p['version'] for p in installed}
          for p,v in entries.items():
              assert closure.get(p)==v, (p,v,closure.get(p))
          for p in ('setuptools','wheel'):
              assert p in closure,p
              entries[p]=closure[p]
          extra={k:v for k,v in closure.items() if k not in entries and k not in ('pip','openclaw-local-fedora')}
          assert 'faster-whisper' in extra, extra
          print('LOCK_CLOSURE_PRODUCTION_PACKAGES',len(entries),'SPEECH_EXTRAS',len(extra))
          def hash_rows(inventory):
              out=[]
              for name,version in sorted(inventory.items()):
                  url=f'https://pypi.org/pypi/{name}/{version}/json'
                  with urllib.request.urlopen(url,timeout=30) as response:
                      manifest=json.load(response)
                  if manifest['info']['version']!=version: raise ValueError(name)
                  hashes=sorted({f['digests']['sha256'] for f in manifest['urls'] if f['packagetype']=='bdist_wheel'})
                  if not hashes: raise ValueError('no wheel for '+name)
                  out.append(name+'=='+version+' \\\n'+''.join('    --hash=sha256:'+digest+(' \\\n' if i<len(hashes)-1 else '\n') for i,digest in enumerate(hashes)))
              return ''.join(out)
          production='# SHA256 pins: PyPI official wheel release inventories, Fedora/CPython-compatible only.\n--only-binary=:all:\n'+hash_rows(entries)
          speech='# Additional speech-only wheel hashes; must be installed with the reviewed production lock.\n-r python-runtime-hashes.txt\n'+hash_rows(extra)
          (root/'python-runtime-hashes.txt').write_text(production)
          (root/'python-speech-hashes.txt').write_text(speech)
          PY
      - name: Output locked artifacts for reviewed connector commit
        run: |
          python - <<'PY'
          import json,pathlib
          for name in ('config/npm-runtime/package-lock.json','config/python-runtime-hashes.txt','config/python-speech-hashes.txt'):
              data=pathlib.Path(name).read_text()
              encoded=json.dumps(data,ensure_ascii=True)
              for index,start in enumerate(range(0,len(encoded),3200)):
                  print('LOCK_CHUNK|' + name + '|' + str(index) + '|' + encoded[start:start+3200],flush=True)
              print('LOCK_END|' + name + '|' + str(len(encoded)),flush=True)
          PY
