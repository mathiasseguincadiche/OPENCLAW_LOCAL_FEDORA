name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-python:
    name: CodeQL / Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:python"
          output: codeql-diagnostics
      - name: Inspect CodeQL findings for remediation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("codeql-diagnostics").glob("*.sarif")):
              data = json.loads(path.read_text(encoding="utf-8"))
              for run in data.get("runs", []):
                  rules = {
                      rule.get("id"): rule
                      for rule in run.get("tool", {}).get("driver", {}).get("rules", [])
                  }
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId", "unknown")
                      rule = rules.get(rule_id, {})
                      level = result.get("level", "warning")
                      message = result.get("message", {}).get("text", "").replace("\n", " ")
                      location = (result.get("locations") or [{}])[0].get("physicalLocation", {})
                      uri = location.get("artifactLocation", {}).get("uri", "?")
                      region = location.get("region", {})
                      line = region.get("startLine", "?")
                      severity = (
                          rule.get("properties", {}).get("security-severity")
                          or rule.get("properties", {}).get("problem.severity")
                          or level
                      )
                      traces = result.get("codeFlows") or []
                      origin = "unknown"
                      if traces:
                          flows = traces[0].get("threadFlows") or []
                          if flows:
                              points = flows[0].get("locations") or []
                              if points:
                                  loc = points[0].get("location", {}).get("physicalLocation", {})
                                  origin_uri = loc.get("artifactLocation", {}).get("uri", "?")
                                  origin_line = loc.get("region", {}).get("startLine", "?")
                                  origin = f"{origin_uri}:{origin_line}"
                      print(
                          f"CODEQL_FINDING {severity} {rule_id} "
                          f"{uri}:{line} ORIGIN={origin} {message[:200]}"
                      )
          PY
