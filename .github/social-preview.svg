<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Atelier IA local — Infrastructure &amp; OPS</title>
  <desc id="desc">Un modèle Qwen local partagé par sept rôles spécialisés via OpenClaw 2026.9.8 pour apprendre, concevoir et vérifier des projets d’infrastructure sur Fedora 44. Qualification matérielle Intel Arc B580/Vulkan à produire.</desc>
